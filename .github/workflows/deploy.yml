name: Build and Deploy MERN E-Commerce to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: mern-ecommerce
  INSTANCE_ID: i-0d7c06ce4178de35a
  PUBLIC_URL: http://13.205.95.100

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build diagnostics - verify project structure
        run: |
          echo "Verifying repository structure..."
          test -f backend/server.js || { echo "ERROR: backend/server.js missing"; exit 1; }
          test -f frontend/package.json || { echo "ERROR: frontend/package.json missing"; exit 1; }
          test -f Dockerfile || { echo "ERROR: Dockerfile missing"; exit 1; }
          echo "Structure OK"

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "${AWS_REGION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"
        env:
          ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce
        continue-on-error: false

      - name: Login to ECR and push image
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}"
          LATEST_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" -f Dockerfile .
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"

          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy via SSM to EC2 instance
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          export IMAGE_URI="${{ env.IMAGE_URI }}"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e NODE_ENV=production -e PORT=5000 -e AWS_REGION=$AWS_REGION $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)

          echo "Waiting for SSM command $COMMAND_ID..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --output json
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then exit 1; fi

      - name: Health check - verify HTTP 200
        run: |
          echo "Waiting for application to start..."
          sleep 30
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed - last status: $HTTP_CODE"
          exit 1