name: Build and Deploy MERN Ecommerce to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: mern-ecommerce
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-038c8a6e7710be5b0
  PUBLIC_URL: http://13.205.95.100

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via env
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile not found at repository root"
            exit 1
          fi
          echo "Dockerfile found, contents:"
          head -n 5 Dockerfile

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:${{ github.sha }}" -t "$FULL_IMAGE:latest" .
          echo "Built image:"
          docker images | grep mern-ecommerce

      - name: Login to Amazon ECR and push image
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /home/ec2-user/app.env $IMAGE_URI",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          sleep 15
          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION" || true
          aws ssm get-command-invocation --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "CommandPlugins[0].Output" --output text

      - name: Health check
        run: |
          echo "Waiting for service to become healthy at $PUBLIC_URL ..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed: did not receive HTTP 200 from $PUBLIC_URL"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment successful."
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          echo "Instance: $INSTANCE_ID"
          echo "URL: $PUBLIC_URL"