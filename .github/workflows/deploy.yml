name: Build and Deploy MERN E-Commerce to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mern-ecommerce
  INSTANCE_ID: i-0d7c06ce4178de35a
  SECRETS_ID: deptic/mern-ecommerce/secrets
  PUBLIC_URL: http://13.205.95.100

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "IMAGE_URI=$FULL_IMAGE:${{ github.sha }}" >> $GITHUB_ENV
          echo "IMAGE_URI_LATEST=$FULL_IMAGE:latest" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image
        run: |
          docker build -t "$IMAGE_URI" -t "$IMAGE_URI_LATEST" -f Dockerfile .
          docker image inspect "$IMAGE_URI" > /dev/null && echo "Build diagnostics: image built successfully"
          docker images | head -5

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker push "$IMAGE_URI_LATEST"

      - name: Deploy to EC2 via SSM
        run: |
          REGION="$AWS_REGION"
          INSTANCE="$INSTANCE_ID"
          ECR_REGISTRY_VAL="$ECR_REGISTRY"
          IMAGE="$IMAGE_URI"
          SECRETS="$SECRETS_ID"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY_VAL}",
              "aws secretsmanager get-secret-value --secret-id ${SECRETS} --region ${REGION} --query SecretString --output text > /tmp/app.env",
              "echo 'PORT=5000' >> /tmp/app.env",
              "echo 'NODE_ENV=production' >> /tmp/app.env",
              "echo 'CLIENT_URL=${PUBLIC_URL}' >> /tmp/app.env",
              "docker pull ${IMAGE}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --env-file /tmp/app.env --name app ${IMAGE}",
              "rm -f /tmp/app.env",
              "sleep 15",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --region "$REGION" --query Status --output text)
            echo "Attempt $i status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --region "$REGION"
              exit 1
            fi
            sleep 10
          done
          [ "$STATUS" = "Success" ] || exit 1

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || echo "000")
            echo "Health check attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy at $PUBLIC_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1