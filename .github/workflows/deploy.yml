name: Build and Deploy MERN Ecommerce to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: mern-ecommerce
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-038c8a6e7710be5b0
  PUBLIC_URL: http://13.205.95.100

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install --prefix frontend --legacy-peer-deps

      - name: Lint frontend
        run: npm run lint --prefix frontend || true

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install backend dependencies
        run: npm install --omit=dev --legacy-peer-deps

      - name: Backend syntax check
        run: node --check backend/server.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to ECR and build/push image
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          IMAGE_TAG="${GITHUB_SHA::7}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          docker build -t "$FULL_IMAGE" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" -f Dockerfile .
          docker push "$FULL_IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy via SSM to EC2
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce:latest",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-038c8a6e7710be5b0" \
            --region "ap-south-1" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-038c8a6e7710be5b0" --region "ap-south-1" --query "Status" --output text)
            echo "SSM status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && { aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-038c8a6e7710be5b0" --region "ap-south-1" --query "StandardErrorContent" --output text; exit 1; }
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://13.205.95.100" || true)
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Healthy"; exit 0; }
            sleep 10
          done
          echo "Health check failed"
          exit 1