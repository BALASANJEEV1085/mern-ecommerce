name: Build and Deploy MERN E-Commerce to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mern-ecommerce
  INSTANCE_ID: i-038c8a6e7710be5b0
  PUBLIC_URL: http://13.205.95.100
  HEALTH_URL: http://13.205.95.100

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build diagnostics - verify expected files exist
        run: |
          echo "Verifying repository structure..."
          test -f package.json || { echo "FAIL: package.json missing"; exit 1; }
          test -f frontend/package.json || { echo "FAIL: frontend/package.json missing"; exit 1; }
          test -f frontend/index.html || { echo "FAIL: frontend/index.html missing"; exit 1; }
          test -f backend/server.js || { echo "FAIL: backend/server.js missing"; exit 1; }
          echo "Repository structure verified."

      - name: Install backend dependencies
        run: npm install --legacy-peer-deps

      - name: Install frontend dependencies
        run: npm install --prefix frontend --legacy-peer-deps

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Verify frontend build output
        run: |
          test -f frontend/dist/index.html || { echo "FAIL: frontend/dist/index.html missing after build"; exit 1; }
          echo "Frontend build output verified."

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to Amazon ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        id: image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "IMAGE_URI=$FULL_IMAGE:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "Built image URI: $FULL_IMAGE:${GITHUB_SHA::8}"

      - name: Build and push Docker image
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" -f Dockerfile .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to EC2 via SSM (pull and restart container)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::8}"
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text)
            echo "Attempt $i: SSM command status = $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed in time"
            exit 1
          fi

      - name: Verify deployment (health check must return HTTP 200)
        run: |
          echo "Waiting for application to become healthy at $HEALTH_URL ..."
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP status = $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: application is healthy (HTTP 200)."
              exit 0
            fi
            sleep 15
          done
          echo "FAIL: health check did not return HTTP 200"
          exit 1