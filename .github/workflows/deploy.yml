name: Build and Deploy MERN E-Commerce to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mern-ecommerce
  INSTANCE_ID: i-0d7c06ce4178de35a
  SECRETS_MANAGER_ID: deptic/mern-ecommerce/secrets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static env)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS creds configured via environment"

      - name: Build backend dependencies (diagnostic)
        run: |
          npm install --legacy-peer-deps
          node -e "console.log('Backend dependency tree OK')"

      - name: Build frontend (diagnostic)
        run: |
          npm install --prefix frontend --legacy-peer-deps
          npm run build --prefix frontend
          ls -la frontend/dist
          test -f frontend/dist/index.html

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${{ github.sha }}" -f Dockerfile .
          docker images | head -5

      - name: Push image to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${{ github.sha }}"

      - name: Deploy to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          REGION="$AWS_REGION"
          INSTANCE="$INSTANCE_ID"
          SECRET_ID="$SECRETS_MANAGER_ID"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "aws secretsmanager get-secret-value --secret-id ${SECRET_ID} --region ${REGION} --query SecretString --output text > /tmp/app-secrets.json",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /tmp/app-secrets.json -e NODE_ENV=production -e PORT=5000 ${IMAGE_URI}",
              "sleep 10 && docker ps | grep app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --region "$REGION" --query Status --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --region "$REGION" --query "{Status:Status,Output:Output,Error:StandardErrorContent}" --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

      - name: Health check (must return HTTP 200)
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://13.205.95.100/ || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy at http://13.205.95.100"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1