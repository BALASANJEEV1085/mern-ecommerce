name: Build and Deploy MERN E-Commerce to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mern-ecommerce
  INSTANCE_ID: i-0d7c06ce4178de35a
  SECRETS_ID: deptic/mern-ecommerce/secrets
  PUBLIC_URL: http://13.205.95.100

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:${{ github.sha }}" -t "$FULL_IMAGE:latest" -f Dockerfile .
          docker image inspect "$FULL_IMAGE:${{ github.sha }}" > /dev/null && echo "IMAGE_BUILD_OK"

      - name: Push Docker image
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          docker push "$FULL_IMAGE:latest"

  deploy-and-verify:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          aws sts get-caller-identity

      - name: Deploy via SSM to EC2
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          ECR_REPOSITORY="${{ env.ECR_REPOSITORY }}"
          SECRETS_ID="${{ env.SECRETS_ID }}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "aws secretsmanager get-secret-value --secret-id ${SECRETS_ID} --region ${REGION} --query SecretString --output text > /tmp/app-env.json",
              "python3 -c \"import json; d=json.load(open('/tmp/app-env.json')); print('\\\\n'.join(f'{k}={v}' for k,v in d.items()))\" > /tmp/app.env",
              "chmod 600 /tmp/app.env",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --env-file /tmp/app.env -e NODE_ENV=production -e PORT=5000 -p 80:80 --name app ${IMAGE_URI}",
              "rm -f /tmp/app.env /tmp/app-env.json",
              "sleep 15",
              "docker ps --filter name=app --filter status=running --format '{{.Names}} {{.Status}}' | grep app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command to complete
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          REGION="${{ env.AWS_REGION }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "${{ env.SSM_COMMAND_ID }}" --instance-id "${{ env.INSTANCE_ID }}" --region "$REGION" --query Status --output text)
            echo "Attempt $i: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "${{ env.SSM_COMMAND_ID }}" --instance-id "${{ env.INSTANCE_ID }}" --region "$REGION" --query "{Output:StandardOutputContent,Error:StandardErrorContent}" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

      - name: Health check (must return HTTP 200)
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ env.PUBLIC_URL }}/")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy at ${{ env.PUBLIC_URL }}"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: did not receive HTTP 200 from ${{ env.PUBLIC_URL }}"
          exit 1