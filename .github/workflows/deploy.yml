name: Build and Deploy MERN E-Commerce to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: mern-ecommerce
  INSTANCE_ID: i-038c8a6e7710be5b0
  PUBLIC_URL: http://13.205.95.100

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (env)
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"

      - name: Compute image URI
        id: image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "uri=$FULL_IMAGE:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "Image URI: $FULL_IMAGE:${GITHUB_SHA::8}"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (frontend build inside Dockerfile)
        run: |
          IMAGE_URI="${{ steps.image.outputs.uri }}"
          docker build \
            --build-arg NODE_ENV=production \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -f Dockerfile .

      - name: Push Docker image to ECR
        run: |
          IMAGE_URI="${{ steps.image.outputs.uri }}"
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Print build diagnostics
        if: always()
        run: |
          echo "=== Build diagnostics ==="
          docker images || true
          echo "Region: $AWS_REGION"
          echo "ECR repo: $ECR_REGISTRY/$ECR_REPOSITORY"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (env)
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"

      - name: Deploy via SSM to EC2 (pull image and run container)
        run: |
          IMAGE_URI="759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce:latest"
          REGION="ap-south-1"
          INSTANCE_ID="i-038c8a6e7710be5b0"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output text

      - name: Verify container is running
        run: |
          REGION="ap-south-1"
          INSTANCE_ID="i-038c8a6e7710be5b0"

          cat > /tmp/ssm-verify.json << SSMPARAMS
          {
            "commands": [
              "docker ps --filter name=app --format '{{.Names}} {{.Status}}' && docker inspect app --format '{{.State.Status}}'"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-verify.json \
            --query "Command.CommandId" --output text)

          sleep 5
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "StandardOutputContent" --output text | grep -q "running" || {
            echo "Container is not running"
            exit 1
          }

  verify-health:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check (must return HTTP 200)
        run: |
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $PUBLIC_URL did not return HTTP 200"
          exit 1